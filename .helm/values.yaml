# Deployment settings
name: eqcms-seo-service
componentsLabel: seo-service
replicaCount: 1
namespace: cms

# App settings
secretName: eqsitecms-seo-service-secret
containerPort: 8000
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

metrics:
  enabled: true
  metricsPort: 9000
  interval: 30s

# Image settings
image: ghcr.io/igor-526/eqsitecms-seo-service
imagePullSecertName: ghcr-secret
imageTag: latest

migration:
  command: ["uv", "run", "alembic", "-c", "alembic.ini", "upgrade", "head"]
  workingDir: /app/src

workers:
  - name: seo-maintenance
    command: ["uv", "run", "--no-sync", "python", "-m", "maintenance.main"]
    replicas: 1
  - name: seo-scheduler
    command: ["uv", "run", "--no-sync", "python", "-m", "scheduler.main"]
    replicas: 1